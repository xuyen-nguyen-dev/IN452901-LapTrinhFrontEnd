<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sự kiện sắp diễn ra – EduHub Web</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="logo" href="index.html">EduHub Web</a>
      <nav aria-label="Điều hướng chính">
        <ul class="menu">
          <li><a href="index.html">TRANG CHỦ</a></li>
          <li><a href="index.html" aria-current="page">SỰ KIỆN</a></li>
          <li><a href="#">ĐĂNG KÝ</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <h1>Sự kiện sắp diễn ra</h1>

      <form id="search-form">
        <label for="keyword">Tìm sự kiện</label>
        <input
          type="search"
          id="keyword"
          name="keyword"
          placeholder="Tìm sự kiện..."
        />
        <button type="submit">TÌM</button>
      </form>

      <p id="status" role="status"></p>

      <div id="event-list">
        <article class="card">
          <img
            src="img/event.svg"
            alt="Biểu tượng lịch sự kiện"
            width="320"
            height="180"
          />
          <h2>
            <a href="event-detail.html?id=22222222-2222-4222-8222-000000000001"
              >Workshop Git &amp; GitHub cho tân sinh viên</a
            >
          </h2>
          <p>
            <time datetime="2026-09-12T01:00:00.000Z">10:10 22/08/2026</time>
          </p>
          <p>Phòng máy A3.201</p>
          <p>Còn 12/40 chỗ</p>
        </article>

        <article class="card">
          <img
            src="img/event.svg"
            alt="Biểu tượng lịch sự kiện"
            width="320"
            height="180"
          />
          <h2>
            <a href="event-detail.html?id=22222222-2222-4222-8222-000000000004"
              >Hackathon EduHub 24 giờ</a
            >
          </h2>
          <p>
            <time datetime="2026-12-19T01:00:00.000Z">08:00 19/12/2026</time>
          </p>
          <p>Phòng máy A3.205</p>
          <p><span class="badge">Hết chỗ</span></p>
        </article>
      </div>
    </main>

    <footer class="site-footer">
      <p>&copy; 2026 EduHub Web</p>
    </footer>

    <script src="js/app.js"></script>
  </body>
</html>
